<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sisorg Reports</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f7f7f4;
  padding: 2rem;
  max-width: 900px;
  margin: 0 auto;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  background: white;
  padding: 1.5rem;
  border-radius: 10px;
  border: 0.5px solid #e8e8e4;
}
h1 {
  font-size: 20px;
  color: #0A2D19;
}
.user-info {
  font-size: 13px;
  color: #888;
}
.user-email {
  font-weight: 600;
  color: #0A2D19;
}
.logout-btn {
  background: #F27E49;
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
}
.logout-btn:hover {
  background: #E26A3A;
}
.reports-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
}
.report-card {
  background: white;
  border: 0.5px solid #e8e8e4;
  border-radius: 10px;
  padding: 1.5rem;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.report-card:hover {
  border-color: #F27E49;
  box-shadow: 0 4px 12px rgba(242, 126, 73, 0.1);
  transform: translateY(-2px);
}
.report-title {
  font-size: 15px;
  font-weight: 600;
  color: #0A2D19;
  margin-bottom: 0.5rem;
}
.report-desc {
  font-size: 12px;
  color: #888;
  line-height: 1.4;
}
.report-date {
  font-size: 11px;
  color: #bbb;
  margin-top: 1rem;
}
</style>
</head>
<body>

<header>
  <h1>📊 Sisorg Reports</h1>
  <div>
    <div class="user-info">
      Conectado como <span class="user-email" id="userEmail"></span>
    </div>
    <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<div class="reports-grid">
  <a href="./dev60_full_report.html" class="report-card">
    <div class="report-title">🐛 DEV-60 Bug Tracker</div>
    <div class="report-desc">Dynamic Pricing Stage 2 — análisis de bugs y estado</div>
    <div class="report-date">Actualizado: 27 de mayo</div>
  </a>
  
  <a href="./revenue-management.html" class="report-card">
    <div class="report-title">💰 Revenue Management</div>
    <div class="report-desc">Métricas y análisis de adopción de RM</div>
    <div class="report-date">Actualizado: recientemente</div>
  </a>
  
  <a href="./new-tms.html" class="report-card">
    <div class="report-title">🚀 New TMS</div>
    <div class="report-desc">Progreso del proyecto LEAN</div>
    <div class="report-date">Actualizado: recientemente</div>
  </a>
</div>

<script>
window.onload = function() {
  const email = localStorage.getItem('email');
  if (!email) {
    window.location.href = './index.html';
    return;
  }
  document.getElementById('userEmail').textContent = email;
};

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('email');
  window.location.href = './index.html';
}
</script>

</body>
</html>
